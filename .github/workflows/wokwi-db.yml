name: Wokwi Simulation → Database

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MYSQLHOST:     ${{ secrets.MYSQLHOST }}
      MYSQLPORT:     ${{ secrets.MYSQLPORT }}
      MYSQLDATABASE: ${{ secrets.MYSQLDATABASE }}
      MYSQLUSER:     ${{ secrets.MYSQLUSER }}
      MYSQLPASSWORD: ${{ secrets.MYSQLPASSWORD }}
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
      ESP32_DEVICE_NAME: "ESP32-POLI"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: pip install mysql-connector-python

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Firmware
        working-directory: esp32/wokwi
        run: pio run

      - name: Install wokwi-cli
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh
          echo "$HOME/.wokwi/bin" >> $GITHUB_PATH

      - name: Run scenario-full-day
        working-directory: esp32/wokwi
        run: wokwi-cli --timeout 90000 --scenario scenario-full-day.yaml . | python3 write-db.py
        continue-on-error: true

      - name: Run scenario-flood-alert
        working-directory: esp32/wokwi
        run: wokwi-cli --timeout 90000 --scenario scenario-flood-alert.yaml . | python3 write-db.py
        continue-on-error: true

      - name: Run scenario-gas-alert
        working-directory: esp32/wokwi
        run: wokwi-cli --timeout 90000 --scenario scenario-gas-alert.yaml . | python3 write-db.py
        continue-on-error: true

      - name: Run scenario-night
        working-directory: esp32/wokwi
        run: wokwi-cli --timeout 90000 --scenario scenario-night.yaml . | python3 write-db.py
        continue-on-error: true